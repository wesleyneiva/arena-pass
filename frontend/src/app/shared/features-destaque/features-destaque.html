<div class="grid gap-4">
  @for (feature of features; track feature.titulo) {
    <div class="flex items-start gap-3.5">
      <div class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-blue-400/15 text-blue-300">
        <app-icon [name]="feature.icone" [size]="14" />
      </div>
      <div class="min-w-0">
        <p class="text-sm font-medium text-white">{{ feature.titulo }}</p>
        <p class="mt-0.5 text-xs leading-relaxed text-neutral-400">{{ feature.descricao }}</p>
      </div>
    </div>
  }
</div>
