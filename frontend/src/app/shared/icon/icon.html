<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.75"
  stroke-linecap="round"
  stroke-linejoin="round"
  class="shrink-0"
>
  @switch (name()) {
    @case ('grid') {
      <rect x="3" y="3" width="7" height="7" rx="1.5" />
      <rect x="14" y="3" width="7" height="7" rx="1.5" />
      <rect x="3" y="14" width="7" height="7" rx="1.5" />
      <rect x="14" y="14" width="7" height="7" rx="1.5" />
    }
    @case ('users') {
      <path d="M16 19v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 17.5V19" />
      <circle cx="9" cy="8" r="3.25" />
      <path d="M17.5 19v-1.5a3.5 3.5 0 0 0-2.5-3.35" />
      <path d="M14.5 4.65a3.25 3.25 0 0 1 0 6.3" />
    }
    @case ('calendar') {
      <rect x="3.5" y="5" width="17" height="15.5" rx="2" />
      <path d="M3.5 9.5h17" />
      <path d="M8 3v3.5" />
      <path d="M16 3v3.5" />
    }
    @case ('chart') {
      <path d="M4 20V10" />
      <path d="M11 20V4" />
      <path d="M18 20v-7" />
      <path d="M3 20h18" />
    }
    @case ('logout') {
      <path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3" />
      <path d="M15 16l4-4-4-4" />
      <path d="M19 12H9" />
    }
    @case ('menu') {
      <path d="M3.5 6.5h17" />
      <path d="M3.5 12h17" />
      <path d="M3.5 17.5h17" />
    }
    @case ('close') {
      <path d="M5 5l14 14" />
      <path d="M19 5L5 19" />
    }
    @case ('clipboard') {
      <rect x="5" y="4.5" width="14" height="16" rx="2" />
      <path d="M9 4.5V3.75A1.75 1.75 0 0 1 10.75 2h2.5A1.75 1.75 0 0 1 15 3.75V4.5" />
      <path d="M8.5 11h7" />
      <path d="M8.5 15h7" />
    }
    @case ('qrcode') {
      <rect x="3.5" y="3.5" width="6" height="6" rx="1" />
      <rect x="14.5" y="3.5" width="6" height="6" rx="1" />
      <rect x="3.5" y="14.5" width="6" height="6" rx="1" />
      <path d="M14.5 14.5h2.75v2.75" />
      <path d="M20.5 14.5v3" />
      <path d="M14.5 20.5h3" />
      <path d="M20.5 20.5v.01" />
    }
    @case ('plus') {
      <path d="M12 5v14" />
      <path d="M5 12h14" />
    }
    @case ('check') {
      <path d="M4 12.5l5 5L20 6" />
    }
    @case ('ban') {
      <circle cx="12" cy="12" r="8.5" />
      <path d="M6.3 6.3l11.4 11.4" />
    }
    @case ('refresh') {
      <path d="M4 12a8 8 0 0 1 14-5.2" />
      <path d="M18 4v3.5h-3.5" />
      <path d="M20 12a8 8 0 0 1-14 5.2" />
      <path d="M6 20v-3.5h3.5" />
    }
    @case ('pencil') {
      <path d="M4 20l.75-3.5L16.5 4.75a1.5 1.5 0 0 1 2.12 0l.63.63a1.5 1.5 0 0 1 0 2.12L7.5 19.25 4 20Z" />
    }
    @case ('shield') {
      <path d="M12 3l7 3v5.5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3Z" />
    }
  }
</svg>
