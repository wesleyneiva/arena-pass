<div class="grid grid-cols-2 gap-2.5 sm:grid-cols-3 md:grid-cols-4">
  @for (slot of slots(); track slot.horaInicio) {
    <button
      type="button"
      (click)="selecionar(slot)"
      [disabled]="!slot.livre || bloqueada()"
      class="rounded-xl border px-3 py-2.5 text-xs font-medium transition-all duration-150"
      [class]="classesSlot(slot)"
    >
      {{ intervalo(slot) }}
      <span class="mt-0.5 block text-[11px] opacity-75">{{ rotulo(slot) }}</span>
    </button>
  }
</div>
