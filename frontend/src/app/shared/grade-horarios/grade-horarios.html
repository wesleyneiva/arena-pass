<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2">
  @for (slot of slots(); track slot.horaInicio) {
    <button
      type="button"
      (click)="selecionar(slot)"
      [disabled]="!slot.livre"
      class="rounded-lg border px-3 py-2 text-sm font-medium transition"
      [class.bg-emerald-50]="slot.livre"
      [class.border-emerald-300]="slot.livre"
      [class.text-emerald-700]="slot.livre"
      [class.hover:bg-emerald-100]="slot.livre"
      [class.cursor-pointer]="slot.livre"
      [class.bg-red-50]="!slot.livre"
      [class.border-red-200]="!slot.livre"
      [class.text-red-600]="!slot.livre"
      [class.cursor-not-allowed]="!slot.livre"
    >
      {{ slot.horaInicio.slice(0, 5) }} - {{ slot.horaFim.slice(0, 5) }}
      <span class="block text-xs opacity-75">{{ slot.livre ? 'Livre' : 'Ocupado' }}</span>
    </button>
  }
</div>
