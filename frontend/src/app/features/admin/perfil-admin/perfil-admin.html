<div class="mb-8">
  <h1 class="text-2xl font-semibold text-slate-900">Meu perfil</h1>
  <p class="mt-1 text-sm text-slate-500">Atualize seu e-mail e senha de acesso.</p>
</div>

<div class="max-w-lg rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
  @if (erro()) {
    <p class="mb-4 animate-fade-in rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700">{{ erro() }}</p>
  }
  @if (sucesso()) {
    <p class="mb-4 animate-fade-in rounded-lg bg-emerald-50 px-4 py-3 text-sm text-emerald-700">{{ sucesso() }}</p>
  }

  <form ngNativeValidate (ngSubmit)="salvar()" class="grid gap-3">
    <div>
      <label class="mb-1.5 block text-sm font-medium text-slate-700">E-mail</label>
      <input required type="email" name="email" [(ngModel)]="email"
        class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm shadow-sm transition focus:border-blue-500 focus:outline-none focus:ring-4 focus:ring-blue-500/15" />
    </div>
    <div>
      <label class="mb-1.5 block text-sm font-medium text-slate-700">Senha atual</label>
      <input required type="password" name="senhaAtual" [(ngModel)]="senhaAtual"
        class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm shadow-sm transition focus:border-blue-500 focus:outline-none focus:ring-4 focus:ring-blue-500/15" />
      <p class="mt-1.5 text-xs text-slate-500">Obrigatória para confirmar qualquer alteração.</p>
    </div>
    <div>
      <label class="mb-1.5 block text-sm font-medium text-slate-700">Nova senha (opcional)</label>
      <input type="password" name="novaSenha" [(ngModel)]="novaSenha" minlength="6"
        class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm shadow-sm transition focus:border-blue-500 focus:outline-none focus:ring-4 focus:ring-blue-500/15" />
    </div>
    @if (novaSenha) {
      <div>
        <label class="mb-1.5 block text-sm font-medium text-slate-700">Confirmar nova senha</label>
        <input required type="password" name="confirmarNovaSenha" [(ngModel)]="confirmarNovaSenha" minlength="6"
          class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm shadow-sm transition focus:border-blue-500 focus:outline-none focus:ring-4 focus:ring-blue-500/15" />
      </div>
    }
    <div>
      <button type="submit" [disabled]="salvando()"
        class="w-full rounded-lg bg-blue-500 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-600 disabled:opacity-60">
        {{ salvando() ? 'Salvando...' : 'Salvar alterações' }}
      </button>
    </div>
  </form>
</div>
