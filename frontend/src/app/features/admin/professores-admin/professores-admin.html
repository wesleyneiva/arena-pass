<h2 class="text-lg font-semibold text-slate-900 mb-4">Professores</h2>

<div class="bg-white border border-slate-200 rounded-lg p-4 mb-4 flex flex-wrap gap-3 items-end">
  <div class="flex-1 min-w-48">
    <label class="block text-xs font-medium text-slate-700 mb-1">Buscar (nome, e-mail ou CPF)</label>
    <input [ngModel]="busca()" (ngModelChange)="atualizarBusca($event)"
      class="w-full rounded-lg border border-slate-300 px-2 py-1.5 text-sm" />
  </div>
  <div>
    <label class="block text-xs font-medium text-slate-700 mb-1">Status</label>
    <select [ngModel]="filtroStatus()" (ngModelChange)="filtroStatus.set($event)"
      class="rounded-lg border border-slate-300 px-2 py-1.5 text-sm">
      <option value="Todos">Todos</option>
      <option value="Pendente">Pendente</option>
      <option value="Aprovado">Aprovado</option>
      <option value="Suspenso">Suspenso</option>
    </select>
  </div>
</div>

<div class="bg-white border border-slate-200 rounded-lg divide-y divide-slate-100">
  @for (professor of professoresFiltrados(); track professor.id) {
    <div class="p-4 flex items-center justify-between">
      <div>
        <p class="font-medium text-slate-900">{{ professor.nome }}</p>
        <p class="text-sm text-slate-500">{{ professor.email }} · CPF {{ professor.cpf }}</p>
      </div>

      <div class="flex items-center gap-3">
        <span
          class="text-xs font-medium px-2 py-1 rounded-full"
          [class.bg-amber-50]="professor.statusAprovacao === 'Pendente'"
          [class.text-amber-700]="professor.statusAprovacao === 'Pendente'"
          [class.bg-emerald-50]="professor.statusAprovacao === 'Aprovado'"
          [class.text-emerald-700]="professor.statusAprovacao === 'Aprovado'"
          [class.bg-red-50]="professor.statusAprovacao === 'Suspenso'"
          [class.text-red-700]="professor.statusAprovacao === 'Suspenso'"
        >
          {{ professor.statusAprovacao }}
        </span>

        @if (professor.statusAprovacao === 'Pendente') {
          <button (click)="aprovar(professor.id)"
            class="text-sm bg-emerald-600 text-white px-3 py-1.5 rounded-lg hover:bg-emerald-700 transition">
            Aprovar
          </button>
        }
      </div>
    </div>
  } @empty {
    <p class="p-4 text-sm text-slate-500">Nenhum professor encontrado com esses filtros.</p>
  }
</div>
