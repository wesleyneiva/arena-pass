<div class="min-h-screen bg-slate-50">
  <header class="no-print bg-white border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <span class="font-semibold text-slate-900">ArenaPass · Professor</span>
        <nav class="flex gap-4 text-sm">
          <a routerLink="/professor/agendar" routerLinkActive="text-emerald-700 font-medium" class="text-slate-600 hover:text-emerald-700">Agendar aula</a>
          <a routerLink="/professor/meus-agendamentos" routerLinkActive="text-emerald-700 font-medium" class="text-slate-600 hover:text-emerald-700">Meus agendamentos</a>
        </nav>
      </div>
      <button (click)="sair()" class="text-sm text-slate-500 hover:text-slate-800">Sair</button>
    </div>
  </header>

  @if (auth.professorAprovado() === false) {
    <div class="bg-amber-50 border-b border-amber-200 text-amber-800 text-sm text-center py-2">
      Seu cadastro ainda está pendente de aprovação pelo clube — você poderá agendar assim que for aprovado.
    </div>
  }

  <main class="max-w-5xl mx-auto px-4 py-8">
    <router-outlet />
  </main>
</div>
