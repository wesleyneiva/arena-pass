<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <h1 class="text-2xl font-semibold text-slate-900 mb-1">ArenaPass</h1>
    <p class="text-sm text-slate-500 mb-6">Entre com sua conta do clube ou de professor.</p>

    <form (ngSubmit)="entrar()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
        <input
          type="email"
          name="email"
          required
          [(ngModel)]="email"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
        <input
          type="password"
          name="senha"
          required
          [(ngModel)]="senha"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
        />
      </div>

      @if (erro()) {
        <p class="text-sm text-red-600">{{ erro() }}</p>
      }

      <button
        type="submit"
        [disabled]="carregando()"
        class="w-full rounded-lg bg-emerald-600 text-white py-2 text-sm font-medium hover:bg-emerald-700 transition disabled:opacity-60"
      >
        {{ carregando() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <p class="text-sm text-slate-500 mt-6 text-center">
      É professor e ainda não tem conta?
      <a routerLink="/registrar" class="text-emerald-700 font-medium hover:underline">Registre-se</a>
    </p>
  </div>
</div>
