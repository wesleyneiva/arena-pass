<div class="flex min-h-screen items-center justify-center bg-slate-50 px-4 py-12">
  <div class="w-full max-w-sm animate-fade-in-up">
    <div class="mb-8 flex items-center justify-center gap-2.5">
      <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-emerald-600 font-semibold text-white">A</div>
      <span class="text-lg font-semibold text-slate-900">ArenaPass</span>
    </div>

    <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
      <h1 class="text-2xl font-semibold text-slate-900">Cadastro de professor</h1>
      <p class="mt-1 mb-6 text-sm text-slate-500">
        Seu cadastro fica pendente até a aprovação do clube.
      </p>

      @if (sucesso()) {
        <p class="animate-scale-in rounded-lg border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-700">
          Cadastro enviado! Assim que o clube aprovar, você já pode fazer login.
        </p>
      } @else {
        <form (ngSubmit)="registrar()" class="space-y-4">
          <div>
            <label class="mb-1.5 block text-sm font-medium text-slate-700">Nome</label>
            <input required name="nome" [(ngModel)]="nome"
              class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm shadow-sm transition focus:border-emerald-500 focus:outline-none focus:ring-4 focus:ring-emerald-500/15" />
          </div>

          <div>
            <label class="mb-1.5 block text-sm font-medium text-slate-700">E-mail</label>
            <input required type="email" name="email" [(ngModel)]="email"
              class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm shadow-sm transition focus:border-emerald-500 focus:outline-none focus:ring-4 focus:ring-emerald-500/15" />
          </div>

          <div>
            <label class="mb-1.5 block text-sm font-medium text-slate-700">CPF (somente números)</label>
            <input required name="cpf" [(ngModel)]="cpf" maxlength="11"
              class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm shadow-sm transition focus:border-emerald-500 focus:outline-none focus:ring-4 focus:ring-emerald-500/15" />
          </div>

          <div>
            <label class="mb-1.5 block text-sm font-medium text-slate-700">Senha</label>
            <input required type="password" name="senha" [(ngModel)]="senha" minlength="6"
              class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm shadow-sm transition focus:border-emerald-500 focus:outline-none focus:ring-4 focus:ring-emerald-500/15" />
          </div>

          @if (erro()) {
            <p class="animate-fade-in rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700">{{ erro() }}</p>
          }

          <button type="submit" [disabled]="carregando()"
            class="w-full rounded-lg bg-emerald-600 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-emerald-700 active:scale-[0.99] disabled:opacity-60">
            {{ carregando() ? 'Enviando...' : 'Cadastrar' }}
          </button>
        </form>
      }
    </div>

    <p class="mt-6 text-center text-sm text-slate-500">
      Já tem conta? <a routerLink="/login" class="font-medium text-emerald-700 hover:underline">Entrar</a>
    </p>
  </div>
</div>
