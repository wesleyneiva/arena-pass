<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <h1 class="text-2xl font-semibold text-slate-900 mb-1">Cadastro de professor</h1>
    <p class="text-sm text-slate-500 mb-6">
      Seu cadastro fica pendente até a aprovação do clube.
    </p>

    @if (sucesso()) {
      <p class="text-sm text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-lg p-3">
        Cadastro enviado! Assim que o clube aprovar, você já pode fazer login.
      </p>
    } @else {
      <form (ngSubmit)="registrar()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Nome</label>
          <input required name="nome" [(ngModel)]="nome"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
          <input required type="email" name="email" [(ngModel)]="email"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">CPF (somente números)</label>
          <input required name="cpf" [(ngModel)]="cpf" maxlength="11"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
          <input required type="password" name="senha" [(ngModel)]="senha" minlength="6"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>

        @if (erro()) {
          <p class="text-sm text-red-600">{{ erro() }}</p>
        }

        <button type="submit" [disabled]="carregando()"
          class="w-full rounded-lg bg-emerald-600 text-white py-2 text-sm font-medium hover:bg-emerald-700 transition disabled:opacity-60">
          {{ carregando() ? 'Enviando...' : 'Cadastrar' }}
        </button>
      </form>
    }

    <p class="text-sm text-slate-500 mt-6 text-center">
      Já tem conta? <a routerLink="/login" class="text-emerald-700 font-medium hover:underline">Entrar</a>
    </p>
  </div>
</div>
