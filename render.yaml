services:
  - type: web
    name: arenapass-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Secret
        sync: false
      - key: Jwt__Issuer
        value: ArenaPass
      - key: Jwt__Audience
        value: ArenaPass
      - key: Jwt__ExpiraEmMinutos
        value: "480"
      - key: Cors__FrontendOrigins__0
        sync: false
      # Um domínio de espaço por índice — cada subdomínio de cliente (ex:
      # https://hrtennis.wnlabs.com.br, https://personaltennis.wnlabs.com.br)
      # precisa da própria entrada aqui, preenchida no dashboard do Render assim que
      # o domínio correspondente for adicionado no projeto da Vercel. Sem isso o
      # navegador bloqueia as chamadas à API por CORS.
      - key: Cors__FrontendOrigins__1
        sync: false
      - key: Cors__FrontendOrigins__2
        sync: false
      - key: Pix__Chave
        sync: false
      - key: Pix__NomeRecebedor
        value: ArenaPass
      - key: Pix__Cidade
        value: SAO PAULO
